<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Movie</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <!-- Card Container -->
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-sm-5">
                        
                        <!-- Header -->
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-dark mb-1">Add New Movie</h2>
                            <p class="text-muted small">Enter the movie details below</p>
                        </div>

                        <!-- Form: action="" rakhna hai taaki views.py ka add_view chal sake -->
                        <form action="" method="POST">
                            {% csrf_token %}
                            
                            <!-- Date Field -->
                            <div class="mb-3">
                                <label for="rdate" class="form-label fw-semibold text-secondary small">Release Date</label>
                                <input type="date" class="form-control" name="rdate" id="rdate" required>
                            </div>

                            <!-- Movie Name Field -->
                            <div class="mb-3">
                                <label for="moviename" class="form-label fw-semibold text-secondary small">Movie Name</label>
                                <input type="text" class="form-control" name="moviename" id="moviename" placeholder="e.g. Inception" required>
                            </div>

                            <!-- Hero Field -->
                            <div class="mb-3">
                                <label for="hero" class="form-label fw-semibold text-secondary small">Hero</label>
                                <input type="text" class="form-control" name="hero" id="hero" placeholder="Lead Actor" required>
                            </div>

                            <!-- Heroine Field -->
                            <div class="mb-3">
                                <label for="heroin" class="form-label fw-semibold text-secondary small">Heroine</label>
                                <input type="text" class="form-control" name="heroin" id="heroin" placeholder="Lead Actress" required>
                            </div>

                            <!-- Rating Field -->
                            <div class="mb-4">
                                <label for="rating" class="form-label fw-semibold text-secondary small">Rating</label>
                                <input type="number" class="form-control" name="rating" id="rating" placeholder="Scale 1 to 5" min="1" max="5" required>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid">
                                <button class="btn btn-primary btn-lg fs-6 fw-medium shadow-sm" type="submit">
                                    Add Movie
                                </button>
                            </div>

                        </form>

                    </div>
                </div> <!-- /card -->

            </div>
        </div>
    </div>

</body>

</html>
