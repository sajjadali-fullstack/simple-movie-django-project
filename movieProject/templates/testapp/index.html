<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Home Page</title>
    <!-- Bootstrap Cdn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <!-- Internal CSS -->
     <style>
        body {
            background-color: #f0f2f5;
        }

        .dashboard {
            margin-top: 180px;
            text-align: center;
        }

        .card-box {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 15px;
        }

        .btn {
            width: 45%;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container dashboard">

        <div class="card-box">

            <h1 style="color: darkcyan;">🎬 Home Dashboard</h1>
            <h4>Movie Gallery</h4>
            <p>Get updates of movie information</p>

            <a href="/add" class="btn btn-primary">➕ Add Movie</a>
            <a href="/display" class="btn btn-success">📋 Display Movies</a>

        </div>

    </div>
</body>
</html>
